<!DOCTYPE html>
<html>
<head>
    <title>ESP32 BLE Distance</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>📏 Jarak</h2>
<input id="distance" value="0" style="font-size:30px;" readonly> cm

<h2>⚙️ Servo</h2>
<input id="servoStatus" value="0°" style="font-size:30px;" readonly>

<br><br>

<button onclick="connect()">CONNECT</button>
<br><br>

<button onclick="setServo(0)">0°</button>
<button onclick="setServo(90)">90°</button>
<button onclick="setServo(180)">180°</button>

<script>

const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // notify
const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // write

let rxChar;

async function connect() {

    const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "ESP32" }],
        optionalServices: [SERVICE_UUID]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    const txChar = await service.getCharacteristic(TX_UUID);
    rxChar = await service.getCharacteristic(RX_UUID);

    // NOTIFICATION
    await txChar.startNotifications();

    txChar.addEventListener('characteristicvaluechanged', (event) => {

        const value = new TextDecoder().decode(event.target.value);

        document.getElementById("distance").value = value;

        console.log("Jarak:", value);
    });

    console.log("Connected");
}

// =========================
// SERVO CONTROL + DISPLAY
// =========================

function setServo(angle) {

    if (!rxChar) return;

    const command = "servo" + angle;

    rxChar.writeValue(new TextEncoder().encode(command));

    // tampilkan di HTML
    document.getElementById("servoStatus").value = angle + "°";

    console.log("Servo:", angle);
}

</script>

</body>
</html>
