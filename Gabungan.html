<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Dashboard</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h1>📡 ESP32 Dashboard</h1>

<h2>📏 Jarak</h2>
<input id="jarak" value="0" style="font-size:30px;" readonly> cm

<h2>⚙️ Servo</h2>
<input id="servo" value="0" style="font-size:30px;" readonly> °

<br><br>

<button onclick="setServo(0)">Servo 0°</button>
<button onclick="setServo(90)">Servo 90°</button>
<button onclick="setServo(180)">Servo 180°</button>

<script>

const ESP_IP = "http://192.168.1.5"; // GANTI INI

// ambil data dari ESP32
async function getData() {
    try {
        const res = await fetch(ESP_IP);
        const data = await res.json();

        document.getElementById("jarak").value = data.jarak;
        document.getElementById("servo").value = data.servo;

    } catch (e) {
        console.log("Error:", e);
    }
}

// kirim command servo
async function setServo(angle) {
    await fetch(ESP_IP + "/servo" + angle);
}

// refresh tiap 500ms
setInterval(getData, 500);

</script>

</body>
</html>
